<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" role="img" aria-label="RetireCompass — household retirement navigator">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b3a4b"/><stop offset="1" stop-color="#0e2a38"/>
    </linearGradient>
    <clipPath id="dial2"><circle cx="120" cy="120" r="66"/></clipPath>
  </defs>
  <rect width="900" height="240" fill="url(#bg)"/>
  <rect x="0" y="0" width="900" height="6" fill="#c9a227"/>
  <!-- compass mark -->
  <g>
    <circle cx="120" cy="120" r="68" fill="#f7f3e9"/>
    <g clip-path="url(#dial2)" stroke="#1b3a4b" stroke-width="1.4" opacity="0.3">
      <g id="tb"><line x1="120" y1="58" x2="120" y2="68"/></g>
      <use href="#tb" transform="rotate(30 120 120)"/><use href="#tb" transform="rotate(60 120 120)"/>
      <use href="#tb" transform="rotate(90 120 120)"/><use href="#tb" transform="rotate(120 120 120)"/>
      <use href="#tb" transform="rotate(150 120 120)"/><use href="#tb" transform="rotate(180 120 120)"/>
      <use href="#tb" transform="rotate(210 120 120)"/><use href="#tb" transform="rotate(240 120 120)"/>
      <use href="#tb" transform="rotate(270 120 120)"/><use href="#tb" transform="rotate(300 120 120)"/>
      <use href="#tb" transform="rotate(330 120 120)"/>
    </g>
    <circle cx="120" cy="120" r="55" fill="none" stroke="#0e7c7b" stroke-width="2" opacity="0.55"/>
    <polygon points="70,120 120,114 170,120 120,126" fill="#0e7c7b"/>
    <polygon points="113,120 127,120 120,168" fill="#1b3a4b"/>
    <polygon points="113,120 127,120 120,72" fill="#c9a227"/>
    <circle cx="120" cy="120" r="6.5" fill="#f7f3e9" stroke="#1b3a4b" stroke-width="2"/>
  </g>
  <g font-family="Segoe UI, Calibri, system-ui, sans-serif">
    <text x="228" y="104" font-size="54" font-weight="800" fill="#ffffff" letter-spacing="0.5">Retire<tspan fill="#c9a227">Compass</tspan></text>
    <text x="230" y="142" font-size="22" fill="#dbe9e9">Household retirement navigator — will your money last?</text>
    <text x="230" y="176" font-size="16" fill="#9fbabb" letter-spacing="0.3">Offline · deterministic · no account · no cloud · not financial advice</text>
  </g>
</svg>
