<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" role="img" aria-label="RetireCompass — plan your retirement, on your own machine">
  <rect width="900" height="220" fill="#1b3a4b"/>
  <rect x="0" y="0" width="900" height="6" fill="#c9a227"/>
  <!-- compass mark -->
  <g transform="translate(96,110)">
    <circle r="62" fill="#f7f3e9" stroke="#0e7c7b" stroke-width="4"/>
    <polygon points="0,-46 11,0 0,-6 -11,0" fill="#1b3a4b"/>
    <polygon points="0,46 -11,0 0,6 11,0" fill="#0e7c7b"/>
    <circle r="7" fill="#c9a227" stroke="#1b3a4b" stroke-width="2"/>
  </g>
  <g font-family="Segoe UI, Calibri, system-ui, sans-serif" fill="#ffffff">
    <text x="200" y="96" font-size="52" font-weight="800" letter-spacing="0.5">Retire<tspan fill="#c9a227">Compass</tspan></text>
    <text x="202" y="132" font-size="21" fill="#cfe0e0">Household retirement navigator — will your money last?</text>
    <text x="202" y="166" font-size="16" fill="#9fb9bb">Offline · deterministic · no account · no cloud · no advice</text>
  </g>
</svg>
