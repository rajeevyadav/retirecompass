<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="RetireCompass logo">
  <defs>
    <clipPath id="dial"><circle cx="48" cy="48" r="43"/></clipPath>
  </defs>
  <circle cx="48" cy="48" r="45" fill="#f7f3e9"/>
  <circle cx="48" cy="48" r="45" fill="none" stroke="#1b3a4b" stroke-width="3"/>
  <!-- degree ticks -->
  <g clip-path="url(#dial)" stroke="#1b3a4b" stroke-width="1" opacity="0.35">
    <g id="t"><line x1="48" y1="6" x2="48" y2="12"/></g>
    <use href="#t" transform="rotate(30 48 48)"/><use href="#t" transform="rotate(60 48 48)"/>
    <use href="#t" transform="rotate(90 48 48)"/><use href="#t" transform="rotate(120 48 48)"/>
    <use href="#t" transform="rotate(150 48 48)"/><use href="#t" transform="rotate(180 48 48)"/>
    <use href="#t" transform="rotate(210 48 48)"/><use href="#t" transform="rotate(240 48 48)"/>
    <use href="#t" transform="rotate(270 48 48)"/><use href="#t" transform="rotate(300 48 48)"/>
    <use href="#t" transform="rotate(330 48 48)"/>
  </g>
  <circle cx="48" cy="48" r="35" fill="none" stroke="#0e7c7b" stroke-width="1.5" opacity="0.55"/>
  <!-- compass star: East-West (teal), then South (navy), then North (gold) -->
  <polygon points="15,48 48,44 81,48 48,52" fill="#0e7c7b"/>
  <polygon points="43,48 53,48 48,80" fill="#1b3a4b"/>
  <polygon points="43,48 53,48 48,16" fill="#c9a227"/>
  <circle cx="48" cy="48" r="4.5" fill="#f7f3e9" stroke="#1b3a4b" stroke-width="1.6"/>
</svg>
