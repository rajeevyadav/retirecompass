name: Restricted Folder Guard
on: [push, pull_request]
permissions: { contents: read }
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if private data or secrets are tracked
        run: |
          if git ls-files | grep -EI '(^|/)(private/|secrets\.|.*\.key$|.*\.pem$)'; then
            echo "Private/secret files must not be tracked."; exit 1
          fi
          echo "No private data or secrets tracked."
